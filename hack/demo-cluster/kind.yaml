# Three nodes: one control plane, two workers.
#
# Two workers rather than one because a DaemonSet on a single-node cluster
# looks exactly like a Deployment, and because a probe failing on one node and
# not the other is a thing worth being able to see.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: probes-demo

# Pin this so the cluster you rebuild in six months is the cluster you built
# today. `make up` prints the image it chose:
#
#   ✓ Ensuring node image (kindest/node:v1.31.0)
#
# Copy that tag here and uncomment. Left unpinned by default because the
# default always matches your installed kind, while a tag that kind does not
# know fails at create time.
#
# It matters for more than tidiness here: sidecars (init containers with
# restartPolicy: Always) are in scope for this plugin, and they are only GA on
# recent Kubernetes. The node image decides whether that path is reachable.
#
# image: kindest/node:v1.31.0

nodes:
- role: control-plane
  kubeadmConfigPatches:
  # ingress-nginx's kind manifest schedules onto the node carrying this label.
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
      - name: node-labels
        value: "ingress-ready=true"
  # Events are how the plugin knows a probe is failing, and the API server
  # throws them away after an hour by default. A day means evidence generated
  # before lunch is still there after it.
  #
  # kubeadm v1beta4 syntax (Kubernetes 1.31+). On an older node image
  # extraArgs is a map instead:  extraArgs: {event-ttl: "24h"}
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
      - name: event-ttl
        value: "24h"
  extraPortMappings:
  # ingress-nginx, on ports needing no privileges and clashing with nothing.
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
- role: worker
- role: worker
