# Three nodes: one control plane, two workers.
#
# Two workers rather than one because a DaemonSet on a single-node cluster
# looks exactly like a Deployment, and because a probe failing on one node and
# not the other is a thing worth being able to see.
#
# Every node pins the same node image, so the cluster rebuilt in six months is
# the cluster built today. Without a pin the Kubernetes version is a side
# effect of whichever kind the person running it happens to have installed.
# This is kind v0.33.0's own default, digest and all; to move it, read the tag
# off `make up`:
#
#   ✓ Ensuring node image (kindest/node:v1.37.0)
#
# Kubernetes 1.37 is what makes the event-ttl patch valid v1beta4, and what
# puts sidecars — init containers with restartPolicy: Always, which this
# plugin treats as in scope — on a release where they are GA.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: probes-demo

nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  kubeadmConfigPatches:
  # Events are how the plugin knows a probe is failing, and the API server
  # throws them away after an hour by default. A day means evidence generated
  # before lunch is still there after it.
  #
  # kubeadm v1beta4 syntax, which the pinned node image is new enough for. On
  # an older image extraArgs is a map instead: {event-ttl: "24h"}
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
      - name: event-ttl
        value: "24h"
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
