# The backend web calls. Configured carefully except that liveness never got a
# timeout, which is the single most common thing to leave out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
      - name: api
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9898
        env:
        - name: PODINFO_UI_MESSAGE
          value: "BACKEND — shop/api · one dot: nothing sits behind this one"
        - name: PODINFO_UI_COLOR
          value: "#3f6f3f"
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
  - name: http
    port: 9898
    targetPort: http
