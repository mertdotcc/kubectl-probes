# A database, with the probe shape databases tend to grow: someone measured
# that it takes a while to come up and wrote the wait into livenessProbe
# instead of reaching for a startup probe, and the liveness timeout drifted
# past its own period. Both are real patterns, not strawmen.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16.4-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: shop
        - name: POSTGRES_USER
          value: shop
        # A demo cluster on a laptop, reachable from nowhere. Do not copy this.
        - name: POSTGRES_PASSWORD
          value: notasecret
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "shop", "-d", "shop"]
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "shop"]
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
