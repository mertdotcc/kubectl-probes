server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Separate endpoints for the two questions, so readiness and liveness are
    # not the same check wearing two hats.
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz  { access_log off; return 200 "ready\n"; }

    location / { try_files $uri $uri/ =404; }
}
