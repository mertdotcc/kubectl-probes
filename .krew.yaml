apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: probes
spec:
  version: {{ .TagName }}
  homepage: https://github.com/mertdotcc/kubectl-probes
  shortDescription: Inspect probe config, timing, and failures
  description: |
    Shows, per workload and container, which startup, readiness, and liveness
    probes are configured, what their settings mean in practice, and what
    evidence of failure the cluster currently reports.

    The default Overview is one row per container, with handler type, headline
    effective timing per probe, aggregated runtime state, and a finding count.
    It ends with a Summary: how many containers have each probe, and how long
    a failing container goes unnoticed across everything in scope. Naming a
    single workload switches to an Inspection: full probe configuration as a
    table, effective timing in sentences, drift between a running pod and its
    pod template, per-pod runtime state, and failure evidence.

    Findings are opinionated observations, reported separately from facts so
    you can tell one from the other. They tell you where to look; they never
    propose a fix.

    The plugin is read-only. It reads pods, their owners, and events, and it
    never exercises a probe.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/mertdotcc/kubectl-probes/releases/download/{{ .TagName }}/kubectl-probes_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-probes
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/mertdotcc/kubectl-probes/releases/download/{{ .TagName }}/kubectl-probes_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-probes
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/mertdotcc/kubectl-probes/releases/download/{{ .TagName }}/kubectl-probes_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-probes
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/mertdotcc/kubectl-probes/releases/download/{{ .TagName }}/kubectl-probes_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-probes
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/mertdotcc/kubectl-probes/releases/download/{{ .TagName }}/kubectl-probes_{{ .TagName }}_windows_amd64.tar.gz" .TagName }}
    bin: kubectl-probes.exe
