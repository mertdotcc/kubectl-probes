<!DOCTYPE html>
<!--
  Copyright 2026 Mert Öztürk
  SPDX-License-Identifier: Apache-2.0

  The Dashboard's frame: a masthead saying whether the plugin is still
  talking, the places a note goes, and an empty table the script fills from
  whichever Report arrived last. Nothing here says anything about a cluster,
  because nothing here has seen one.

  The style and the script are files of their own. The policy this page is
  served under forbids both inline, and a Report carries text the cluster
  wrote. See ADR-0006.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kubectl probes</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>kubectl probes</h1>
      <p class="connection" id="connection" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="connection-state">connecting</span>
      </p>
    </header>

    <main>
      <div class="notes" id="notes" role="status"></div>

      <section class="inspection" id="inspection" aria-labelledby="inspection-name" hidden>
        <div class="inspection-head">
          <h2 id="inspection-name" class="mono"></h2>
          <button type="button" id="inspection-close">Back to the Overview</button>
        </div>
        <p class="inspection-note" id="inspection-note"></p>
        <pre class="inspection-body mono" id="inspection-body"></pre>
      </section>

      <section class="overview" aria-labelledby="overview-heading">
        <div class="controls">
          <h2 id="overview-heading">Overview</h2>
          <input
            type="search"
            id="filter"
            aria-label="Filter by workload or container name"
            placeholder="Filter workloads and containers"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="sort" aria-pressed="false">Severity order</button>
        </div>

        <p class="empty" id="empty" hidden></p>

        <div class="scroller">
          <table id="overview">
            <thead>
              <tr id="overview-head"></tr>
            </thead>
            <tbody id="overview-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
