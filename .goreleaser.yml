version: 2

project_name: kubectl-probes

before:
  hooks:
  - go mod download

builds:
- id: kubectl-probes
  main: .
  binary: kubectl-probes
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ignore:
  # krew has no windows/arm64 consumers worth the archive.
  - goos: windows
    goarch: arm64
  ldflags:
  - -s -w -X main.version={{ .Version }}

archives:
- ids:
  - kubectl-probes
  name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
  wrap_in_directory: false
  formats:
  - tar.gz
  files:
  - LICENSE

checksum:
  name_template: checksums.txt

# A tag with a pre-release suffix, such as v0.2.0-rc.1, is published as a
# GitHub pre-release, and a plain one as a release.
release:
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^chore:'
