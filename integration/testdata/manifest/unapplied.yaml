# A Deployment that has not been applied, beside a Service that has no probes
# to report, which is what `kubectl probes -f deploy.yaml` is read out of.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
      - name: shipping
        image: registry.example.com/shipping:0.9.0
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: prod
spec:
  selector:
    app: shipping
  ports:
  - port: 80
    targetPort: http
