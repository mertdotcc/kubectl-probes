name: Release

on:
  push:
    tags:
    - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release and publish to krew
    runs-on: ubuntu-latest
    steps:
    # goreleaser builds its changelog from history, so it needs the full clone.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: goreleaser release
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Opens the krew-index PR from .krew.yaml, but only for a plugin krew-index
    # already lists. A first submission has to come from a human, and krew's
    # reviewers close one the bot opens, so this step stays off until the
    # repository variable KREW_INDEX_LISTED is set to true, once the hand-made
    # submission has been merged. See the release ticket.
    - name: Update krew-index
      if: vars.KREW_INDEX_LISTED == 'true'
      uses: rajatjindal/krew-release-bot@v0.0.51
